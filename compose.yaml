name: phylogpt
services:
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
  model-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
    entrypoint: ["/bin/sh", "-c"]
    command: ['ollama show "$${OLLAMA_MODEL}" >/dev/null 2>&1 || exec ollama pull "$${OLLAMA_MODEL}"']
    depends_on:
      ollama:
        condition: service_healthy
  app:
    build: .
    image: phylogpt:cds
    platform: linux/amd64
    init: true
    ports:
      - "127.0.0.1:${PHYLOGPT_PORT:-8501}:8501"
    env_file: .env
    environment:
      OLLAMA_URL: http://ollama:11434
      PHYLOGPT_DATA_DIR: /home/mambauser/data
      PHYLOGPT_TOOL_PATH: /opt/conda/bin:/usr/local/bin:/usr/bin:/bin
      PHYLOGPT_DATASETS_BIN: datasets
      PHYLOGPT_MAFFT_BIN: mafft
      PHYLOGPT_RAXML_BIN: raxml-ng
    volumes:
      - analysis-data:/home/mambauser/data
    stop_grace_period: 20s
    depends_on:
      model-init:
        condition: service_completed_successfully
volumes:
  analysis-data:
  ollama-models:
